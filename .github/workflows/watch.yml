name: flight-watch
on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 min (GitHub may delay a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: flight-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: patchright install --with-deps chromium
      - name: Install real Chrome
        run: patchright install chrome || true
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a --server-args="-screen 0 1400x2200x24" python watch.py
      - name: Save debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: |
            last-*.png
            last-*.txt
            data/**
          retention-days: 2
      - name: Commit state
        if: always()
        run: |
          git config user.name "flight-watcher"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet && exit 0
          git commit -m "update state [skip ci]"
          git pull --rebase --autostash || true
          git push
